name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les fichiers web (librairies en local)
        run: |
          IDX=$(find . -name index.html -not -path './node_modules/*' -not -path './www/*' | head -1)
          if [ -z "$IDX" ]; then echo "index.html introuvable. Contenu du dépôt :"; ls -R | head -60; exit 1; fi
          SRC=$(dirname "$IDX")
          echo "Sources web dans : $SRC"
          mkdir www
          cp "$SRC/index.html" www/
          for f in manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" www/; elif [ -f "$f" ]; then cp "$f" www/; else echo "Manquant : $f"; fi
          done
          C=https://cdnjs.cloudflare.com/ajax/libs
          curl -fL --retry 3 -o www/qrcode.min.js $C/qrcodejs/1.0.0/qrcode.min.js
          curl -fL --retry 3 -o www/peerjs.min.js $C/peerjs/1.5.4/peerjs.min.js
          curl -fL --retry 3 -o www/jsQR.min.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js
          sed -i "s#$C/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#; s#$C/peerjs/1.5.4/peerjs.min.js#peerjs.min.js#; s#$C/jsQR/1.4.0/jsQR.min.js#jsQR.min.js#; s#https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js#jsQR.min.js#" www/index.html
          grep -c "cdnjs" www/index.html || true

      - name: Créer le projet Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.mahmoh1960.sharenode","appName":"ShareNode","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android

      - name: Caméra et numéro de version
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Recevoir les fichiers du menu Partager d'Android
        run: |
          D=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          echo "Dossier Java : $D"
          cat > "$D/ShareReceiverPlugin.java" <<'JEOF'
          package com.mahmoh1960.sharenode;

          import android.content.ContentResolver;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;

          @CapacitorPlugin(name = "ShareReceiver")
          public class ShareReceiverPlugin extends Plugin {

            @Override
            protected void handleOnNewIntent(Intent intent) {
              super.handleOnNewIntent(intent);
              getActivity().setIntent(intent);
              notifyListeners("shared", new JSObject());
            }

            @PluginMethod
            public void getShared(PluginCall call) {
              JSArray files = new JSArray();
              Intent intent = getActivity().getIntent();
              String action = intent == null ? null : intent.getAction();
              if (Intent.ACTION_SEND.equals(action) || Intent.ACTION_SEND_MULTIPLE.equals(action)) {
                ArrayList<Uri> uris = new ArrayList<>();
                if (Intent.ACTION_SEND.equals(action)) {
                  Uri one = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (one != null) uris.add(one);
                } else {
                  ArrayList<Uri> many = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                  if (many != null) uris.addAll(many);
                }
                intent.setAction(Intent.ACTION_MAIN);
                ContentResolver cr = getContext().getContentResolver();
                int n = 0;
                for (Uri u : uris) {
                  try {
                    String name = "fichier";
                    Cursor c = cr.query(u, null, null, null, null);
                    if (c != null) {
                      try {
                        int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                        if (idx >= 0 && c.moveToFirst()) name = c.getString(idx);
                      } finally {
                        c.close();
                      }
                    }
                    File out = new File(getContext().getCacheDir(), "shared_" + (n++) + "_" + name.replaceAll("[^A-Za-z0-9._-]", "_"));
                    try (InputStream in = cr.openInputStream(u); FileOutputStream os = new FileOutputStream(out)) {
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) os.write(buf, 0, r);
                    }
                    JSObject f = new JSObject();
                    f.put("name", name);
                    f.put("type", cr.getType(u));
                    f.put("path", out.getAbsolutePath());
                    files.put(f);
                  } catch (Exception e) {
                  }
                }
              }
              JSObject res = new JSObject();
              res.put("files", files);
              call.resolve(res);
            }
          }
          JEOF
          cat > "$D/MainActivity.java" <<'JEOF'
          package com.mahmoh1960.sharenode;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShareReceiverPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JEOF
          python3 - <<'PEOF'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f=''.join('<intent-filter><action android:name="android.intent.action.%s"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="*/*"/></intent-filter>\n'%a for a in ('SEND','SEND_MULTIPLE'))
          s=s.replace('</activity>',f+'</activity>',1)
          open(p,'w').write(s)
          print('manifest ok')
          PEOF

      - name: Icône de l'application (facultatif)
        continue-on-error: true
        run: |
          mkdir -p resources
          convert www/icon-512.png -resize 1024x1024 resources/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b192c' --iconBackgroundColorDark '#0b192c'

      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clé de signature stable (mises à jour sans désinstaller)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Compiler l'APK de test (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareNode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
