name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les fichiers web (librairies en local)
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          C=https://cdnjs.cloudflare.com/ajax/libs
          curl -fL --retry 3 -o www/qrcode.min.js $C/qrcodejs/1.0.0/qrcode.min.js
          curl -fL --retry 3 -o www/peerjs.min.js $C/peerjs/1.5.4/peerjs.min.js
          curl -fL --retry 3 -o www/jsQR.min.js $C/jsQR/1.4.0/jsQR.min.js
          sed -i "s#$C/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#; s#$C/peerjs/1.5.4/peerjs.min.js#peerjs.min.js#; s#$C/jsQR/1.4.0/jsQR.min.js#jsQR.min.js#" www/index.html
          grep -c "cdnjs" www/index.html || true

      - name: Créer le projet Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.mahmoh1960.sharenode","appName":"ShareNode","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android

      - name: Autoriser la caméra
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Icône de l'application (facultatif)
        continue-on-error: true
        run: |
          mkdir -p resources
          convert icon-512.png -resize 1024x1024 resources/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b192c' --iconBackgroundColorDark '#0b192c'

      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareNode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
